name: CI

env:
   HUSKY: 0

on:
   push:
      branches: [main]
   pull_request:

permissions:
   contents: read

concurrency:
   group: ci-${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   check:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out repository
           uses: actions/checkout@v7

         - name: Set up pnpm
           uses: pnpm/action-setup@v6
           with:
              version: 10.12.1

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Build and test
           run: pnpm run check

   minimum-peers:
      name: check (oldest supported effect)
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out repository
           uses: actions/checkout@v7

         - name: Set up pnpm
           uses: pnpm/action-setup@v6
           with:
              version: 10.12.1

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         # Keep effect at the lower bound of peerDependencies.effect in
         # package.json. @effect/vitest moves in lockstep with effect and
         # each release requires effect >= its own version, so pin the
         # matching release rather than testing an unsupported pair.
         - name: Install oldest supported effect
           run: pnpm add --save-dev --save-exact effect@4.0.0 @effect/vitest@4.0.0

         - name: Build and test
           run: pnpm run typecheck && pnpm test && pnpm run build
